# Kissaten Morning (transparent) for k9s
# upstream: https://github.com/bytebeast/kissaten.nvim
# Copy to the k9s skins directory, then set `k9s.ui.skin: kissaten_morning_transparent`
# in k9s's config.yaml.
#   Linux:  ~/.config/k9s/skins/
#   macOS:  ~/Library/Application Support/k9s/skins/
#   or run `k9s info` to print the skins directory k9s actually uses

k9s:
  body:
    fgColor: "#353a5c"
    bgColor: "default"
    logoColor: "#7128df"
    logoColorMsg: "#353a5c"
    logoColorInfo: "#1d4fcf"
    logoColorWarn: "#805000"
    logoColorError: "#b7002f"
  prompt:
    fgColor: "#353a5c"
    bgColor: "default"
    suggestColor: "#686f8e"
    border:
      command: "#1d4fcf"
      default: "#00656a"
  help:
    fgColor: "#353a5c"
    bgColor: "default"
    sectionColor: "#24680c"
    keyColor: "#1d4fcf"
    numKeyColor: "#9c3c00"
  frame:
    title:
      fgColor: "#1d4fcf"
      bgColor: "default"
      highlightColor: "#9c2d7a"
      counterColor: "#805000"
      filterColor: "#24680c"
    border:
      fgColor: "#c2c9dc"
      focusColor: "#1d4fcf"
    menu:
      fgColor: "#4f5578"
      keyColor: "#1d4fcf"
      numKeyColor: "#9c3c00"
    crumbs:
      fgColor: "#eef0f6"
      bgColor: "#525494"
      activeColor: "#1d4fcf"
    status:
      newColor: "#1d4fcf"
      modifyColor: "#525494"
      addColor: "#24680c"
      pendingColor: "#9c3c00"
      errorColor: "#b7002f"
      highlightColor: "#00608c"
      killColor: "#7128df"
      completedColor: "#686f8e"
  info:
    fgColor: "#9c3c00"
    sectionColor: "#353a5c"
    cpuColor: "#7128df"
    memColor: "#805000"
    k9sRevColor: "#24680c"
  views:
    table:
      fgColor: "#353a5c"
      bgColor: "default"
      cursorFgColor: "#eef0f6"
      cursorBgColor: "#353a5c"
      markColor: "#9c2d7a"
      header:
        fgColor: "#805000"
        bgColor: "default"
        sorterColor: "#00608c"
        selectedSortColumnColor: "#9c3c00"
    xray:
      fgColor: "#353a5c"
      bgColor: "default"
      cursorColor: "#1d4fcf"
      cursorTextColor: "#eef0f6"
      graphicColor: "#7128df"
    charts:
      bgColor: "default"
      chartBgColor: "default"
      dialBgColor: "default"
      focusFgColor: "#353a5c"
      focusBgColor: "#d3d8e5"
      defaultDialColors:
        - "#24680c"
        - "#b7002f"
      defaultChartColors:
        - "#24680c"
        - "#b7002f"
      resourceColors:
        cpu:
          - "#7128df"
          - "#1d4fcf"
        mem:
          - "#805000"
          - "#9c3c00"
    yaml:
      keyColor: "#00656a"
      valueColor: "#353a5c"
      colonColor: "#4f5578"
    picker:
      mainColor: "#353a5c"
      focusColor: "#1d4fcf"
      shortcutColor: "#9c3c00"
    logs:
      fgColor: "#353a5c"
      bgColor: "default"
      indicator:
        fgColor: "#525494"
        bgColor: "default"
        toggleOnColor: "#24680c"
        toggleOffColor: "#686f8e"
  dialog:
    fgColor: "#353a5c"
    bgColor: "default"
    buttonFgColor: "#353a5c"
    buttonBgColor: "#d3d8e5"
    buttonFocusFgColor: "#eef0f6"
    buttonFocusBgColor: "#1d4fcf"
    labelFgColor: "#9c3c00"
    fieldFgColor: "#353a5c"
