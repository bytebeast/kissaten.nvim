# Kissaten Midnight: https://github.com/bytebeast/kissaten.nvim

[mgr]
cwd = { fg = "#73daca" }
find_keyword = { fg = "#e6c56f", bold = true, italic = true, underline = true }
find_position = { fg = "#f5c2e7", bg = "reset", bold = true, italic = true }
symlink_target = { fg = "#73daca", italic = true }
marker_copied = { fg = "#a6d98a", bg = "#a6d98a" }
marker_cut = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked = { fg = "#73daca", bg = "#73daca" }
marker_selected = { fg = "#e6c56f", bg = "#e6c56f" }
count_copied = { fg = "#0c0c12", bg = "#a6d98a", bold = true }
count_cut = { fg = "#0c0c12", bg = "#f38ba8", bold = true }
count_selected = { fg = "#0c0c12", bg = "#e6c56f", bold = true }
border_style = { fg = "#33364c" }

[tabs]
active = { fg = "#0c0c12", bg = "#7aa2f7", bold = true }
inactive = { fg = "#7a80a8", bg = "#111118" }

[mode]
normal_main = { fg = "#0c0c12", bg = "#7aa2f7", bold = true }
normal_alt = { fg = "#7aa2f7", bg = "#1f2030" }
select_main = { fg = "#0c0c12", bg = "#bb9af7", bold = true }
select_alt = { fg = "#bb9af7", bg = "#1f2030" }
unset_main = { fg = "#0c0c12", bg = "#f38ba8", bold = true }
unset_alt = { fg = "#f38ba8", bg = "#1f2030" }

[indicator]
current = { bg = "#363a56", bold = true }

[status]
perm_sep = { fg = "#575d82" }
perm_type = { fg = "#7aa2f7" }
perm_read = { fg = "#e6c56f" }
perm_write = { fg = "#f38ba8" }
perm_exec = { fg = "#a6d98a" }
progress_label = { fg = "#c8d0f0", bold = true }
progress_normal = { fg = "#7aa2f7", bg = "#2a2c42" }
progress_error = { fg = "#f38ba8", bg = "#2a2c42" }

[which]
border = { fg = "#4d6396" }
mask = { bg = "#1f2030" }
cand = { fg = "#73daca" }
rest = { fg = "#575d82" }
desc = { fg = "#bb9af7" }
separator_style = { fg = "#575d82" }

[confirm]
border = { fg = "#4d6396" }
title = { fg = "#7aa2f7", bold = true }
btn_yes = { fg = "#0c0c12", bg = "#7aa2f7", bold = true }
btn_no = { fg = "#a9b1d6" }

[spot]
border = { fg = "#4d6396" }
title = { fg = "#7aa2f7", bold = true }
tbl_col = { fg = "#7aa2f7" }
tbl_cell = { bg = "#363a56" }

[notify]
title_info = { fg = "#a9d8f0" }
title_warn = { fg = "#e6c56f" }
title_error = { fg = "#f38ba8" }

[pick]
border = { fg = "#4d6396" }
active = { fg = "#7aa2f7", bold = true }

[input]
border = { fg = "#4d6396" }
title = { fg = "#7aa2f7" }
value = { fg = "#c8d0f0" }
hint = { fg = "#7a80a8", italic = true }
selected = { bg = "#2c354f" }

[cmp]
border = { fg = "#4d6396" }
active = { bg = "#363a56", bold = true }

[tasks]
border = { fg = "#4d6396" }
title = { fg = "#7aa2f7" }
hovered = { fg = "#7aa2f7", bold = true }

[help]
border = { fg = "#4d6396" }
chord = { fg = "#73daca" }
hovered = { bg = "#363a56", bold = true }

[filetype]
rules = [
	{ mime = "**/image/*", fg = "#e6c56f" },
	{ mime = "**/{audio,video}/*", fg = "#bb9af7" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f38ba8" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#73daca" },
	{ mime = "vfs/{absent,stale}", fg = "#575d82" },
	{ url = "*", is = "orphan", fg = "#f38ba8" },
	{ url = "*", is = "exec", fg = "#a6d98a" },
	{ url = "*", is = "dummy", fg = "#f38ba8" },
	{ url = "*/", is = "dummy", fg = "#f38ba8" },
	{ url = "*", fg = "#c8d0f0" },
	{ url = "*/", fg = "#7aa2f7" },
]
