  video: { foreground: "#f5c2e7", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  music: { foreground: "#73daca", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  lossless: { foreground: "#73daca", is_bold: true, is_dimmed: false, is_italic: false, is_underline: false }
  crypto: { foreground: "#f9a26a", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  document: { foreground: "#c8d0f0", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  compressed: { foreground: "#f38ba8", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  temp: { foreground: "#7a80a8", is_italic: true, is_bold: false, is_dimmed: false, is_underline: false }
  compiled: { foreground: "#7a80a8", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  build: { foreground: "#e6c56f", is_underline: true, is_bold: false, is_dimmed: false, is_italic: false }
  source: { foreground: "#c8d0f0", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }

punctuation: { foreground: "#575d82", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
date: { foreground: "#b4befe", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
inode: { foreground: "#7a80a8", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
blocks: { foreground: "#7a80a8", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
header: { foreground: "#c8d0f0", is_bold: true, is_underline: true, is_dimmed: false, is_italic: false }
