  video: { foreground: "#9c2d7a", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  music: { foreground: "#00656a", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  lossless: { foreground: "#00656a", is_bold: true, is_dimmed: false, is_italic: false, is_underline: false }
  crypto: { foreground: "#9c3c00", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  document: { foreground: "#353a5c", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  compressed: { foreground: "#b7002f", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  temp: { foreground: "#686f8e", is_italic: true, is_bold: false, is_dimmed: false, is_underline: false }
  compiled: { foreground: "#686f8e", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  build: { foreground: "#805000", is_underline: true, is_bold: false, is_dimmed: false, is_italic: false }
  source: { foreground: "#353a5c", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }

punctuation: { foreground: "#8f96b1", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
date: { foreground: "#525494", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
inode: { foreground: "#686f8e", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
blocks: { foreground: "#686f8e", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
