# Kissaten Morning for eza
# upstream: https://github.com/bytebeast/kissaten.nvim
# Save as theme.yml in eza's config directory:
#   Linux:  ~/.config/eza/theme.yml
#   macOS:  ~/Library/Application Support/eza/theme.yml
#   or anywhere, with EZA_CONFIG_DIR pointing at the folder that holds it

colourful: true

filekinds:
  normal: { foreground: "#353a5c", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  directory: { foreground: "#1d4fcf", is_bold: true, is_dimmed: false, is_italic: false, is_underline: false }
  symlink: { foreground: "#00608c", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  pipe: { foreground: "#4f5578", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  block_device: { foreground: "#805000", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  char_device: { foreground: "#805000", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  socket: { foreground: "#4f5578", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  special: { foreground: "#9c2d7a", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  executable: { foreground: "#24680c", is_bold: true, is_dimmed: false, is_italic: false, is_underline: false }
  mount_point: { foreground: "#00656a", is_underline: true, is_bold: false, is_dimmed: false, is_italic: false }

# read / write / execute keep one color each, so a column reads at a glance
perms:
  user_read: { foreground: "#805000", is_bold: true, is_dimmed: false, is_italic: false, is_underline: false }
  user_write: { foreground: "#b7002f", is_bold: true, is_dimmed: false, is_italic: false, is_underline: false }
  user_execute_file: { foreground: "#24680c", is_bold: true, is_dimmed: false, is_italic: false, is_underline: false }
  user_execute_other: { foreground: "#24680c", is_bold: true, is_dimmed: false, is_italic: false, is_underline: false }
  group_read: { foreground: "#805000", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  group_write: { foreground: "#b7002f", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  group_execute: { foreground: "#24680c", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  other_read: { foreground: "#805000", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  other_write: { foreground: "#b7002f", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  other_execute: { foreground: "#24680c", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  special_user_file: { foreground: "#9c2d7a", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  special_other: { foreground: "#9c2d7a", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  attribute: { foreground: "#686f8e", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }

# bigger files get warmer: bytes -> kilo -> mega -> giga -> huge
size:
  major: { foreground: "#4f5578", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  minor: { foreground: "#2a5f7f", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  number_byte: { foreground: "#353a5c", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  number_kilo: { foreground: "#2a5f7f", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  number_mega: { foreground: "#1d4fcf", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  number_giga: { foreground: "#7128df", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  number_huge: { foreground: "#9c3c00", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  unit_byte: { foreground: "#5c6283", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  unit_kilo: { foreground: "#2a5f7f", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  unit_mega: { foreground: "#1d4fcf", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  unit_giga: { foreground: "#7128df", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  unit_huge: { foreground: "#9c3c00", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }

users:
  user_you: { foreground: "#353a5c", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  user_root: { foreground: "#b7002f", is_bold: true, is_dimmed: false, is_italic: false, is_underline: false }
  user_other: { foreground: "#90433a", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  group_yours: { foreground: "#4f5578", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  group_other: { foreground: "#686f8e", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  group_root: { foreground: "#b7002f", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }

links:
  normal: { foreground: "#00608c", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  multi_link_file: { foreground: "#9c3c00", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }

git:
  new: { foreground: "#24680c", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  modified: { foreground: "#805000", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  deleted: { foreground: "#b7002f", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  renamed: { foreground: "#00656a", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  typechange: { foreground: "#7128df", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  ignored: { foreground: "#8f96b1", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  conflicted: { foreground: "#9c3c00", is_bold: true, is_dimmed: false, is_italic: false, is_underline: false }

git_repo:
