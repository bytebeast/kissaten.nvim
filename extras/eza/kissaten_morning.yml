  selinux:
    colon: { foreground: "#8f96b1", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
    user: { foreground: "#4f5578", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
    role: { foreground: "#7128df", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
    typ: { foreground: "#686f8e", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
    range: { foreground: "#7128df", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }

