  branch_other: { foreground: "#7128df", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  git_clean: { foreground: "#24680c", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }
  git_dirty: { foreground: "#805000", is_bold: false, is_dimmed: false, is_italic: false, is_underline: false }

security_context:
