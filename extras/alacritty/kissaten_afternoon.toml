# Kissaten Afternoon for Alacritty
# upstream: https://github.com/bytebeast/kissaten.nvim
# In alacritty.toml:  [general] import = ["~/.config/alacritty/<this file>"]

[colors.primary]
background = "#282b3e"
foreground = "#cdd5f6"
dim_foreground = "#b0b9dd"

[colors.cursor]
text = "#282b3e"
cursor = "#cdd5f6"

[colors.vi_mode_cursor]
text = "#282b3e"
cursor = "#84a8f8"

[colors.selection]
