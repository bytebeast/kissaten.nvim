# Kissaten Midnight for Alacritty
# upstream: https://github.com/bytebeast/kissaten.nvim
# In alacritty.toml:  [general] import = ["~/.config/alacritty/<this file>"]

[colors.primary]
background = "#16161f"
foreground = "#c8d0f0"
dim_foreground = "#a9b1d6"

[colors.cursor]
text = "#16161f"
cursor = "#c8d0f0"

[colors.vi_mode_cursor]
text = "#16161f"
cursor = "#7aa2f7"

[colors.selection]
text = "CellForeground"
background = "#2c354f"

[colors.search.matches]
foreground = "#c8d0f0"
background = "#443d31"

[colors.search.focused_match]
foreground = "#0c0c12"
background = "#f9a26a"

[colors.footer_bar]
foreground = "#c8d0f0"
background = "#111118"

[colors.hints.start]
foreground = "#0c0c12"
background = "#f5c2e7"

[colors.hints.end]
foreground = "#0c0c12"
background = "#7aa2f7"

[colors.normal]
black = "#2a2c42"
red = "#f38ba8"
green = "#a6d98a"
yellow = "#e6c56f"
blue = "#7aa2f7"
magenta = "#f5c2e7"
cyan = "#73daca"
white = "#a9b1d6"

[colors.bright]
black = "#575d82"
red = "#f8a0b8"
green = "#b4e29a"
yellow = "#edcf81"
blue = "#8fb2fb"
magenta = "#cab0fb"
cyan = "#97d8ff"
white = "#c8d0f0"

[[colors.indexed_colors]]
index = 16
color = "#f9a26a"

[[colors.indexed_colors]]
index = 17
color = "#f38ba8"
