# Kissaten Morning for Alacritty
# upstream: https://github.com/bytebeast/kissaten.nvim
# In alacritty.toml:  [general] import = ["~/.config/alacritty/<this file>"]

[colors.primary]
background = "#eef0f6"
foreground = "#353a5c"
dim_foreground = "#4f5578"

[colors.cursor]
text = "#eef0f6"
cursor = "#353a5c"

[colors.vi_mode_cursor]
text = "#eef0f6"
cursor = "#1d4fcf"

[colors.selection]
text = "CellForeground"
background = "#c8d3ef"

[colors.search.matches]
foreground = "#353a5c"
background = "#d3c8b9"

[colors.search.focused_match]
foreground = "#eef0f6"
background = "#9c3c00"

[colors.footer_bar]
foreground = "#353a5c"
background = "#e0e4ee"

[colors.hints.start]
foreground = "#eef0f6"
background = "#9c2d7a"

[colors.hints.end]
foreground = "#eef0f6"
background = "#1d4fcf"

[colors.normal]
black = "#4f5578"
red = "#b7002f"
green = "#24680c"
yellow = "#805000"
blue = "#1d4fcf"
magenta = "#9c2d7a"
cyan = "#00656a"
white = "#c2c9dc"

[colors.bright]
black = "#686f8e"
red = "#980027"
green = "#1b4d09"
yellow = "#613d00"
blue = "#1945b4"
magenta = "#631eca"
cyan = "#004b6d"
white = "#d4d8e4"

[[colors.indexed_colors]]
index = 16
color = "#9c3c00"

[[colors.indexed_colors]]
index = 17
color = "#b7002f"
